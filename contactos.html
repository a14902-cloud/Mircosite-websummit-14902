    <div class="container contactos">

        <h1 class="text-center">Contactos</h1>

        <p class="text-center">
            Tens alguma dúvida sobre a Web Summit?
            Entra em contacto connosco através do seguinte formulário.
        </p>

        <h3>Informações de contacto</h3>

        <p>Evento: Web Summit Lisboa</p>

        <p>Local: Lisboa, Portugal</p>

        <p>Website:
            <a href="https://websummit.com/" > </a>
        </p>

        <hr>

        <h3>Envia-nos uma mensagem</h3>

        <form>

            <div class="mb-3">
                <label class="form-label">Nome:</label>
                <input type="text" class="form-control"
                placeholder="Escreve o teu nome">
            </div>

            <div class="mb-3">
                <label class="form-label">Email:</label>
                <input type="email" class="form-control"
                placeholder="Escreve o teu email">
            </div>

            <div class="mb-3">
                <label class="form-label">Assunto:</label>
                <input type="text" class="form-control"
                placeholder="Assunto da mensagem">
            </div>

            <div class="mb-3">
                <label class="form-label">Mensagem:</label>
                <textarea class="form-control" rows="5"
                placeholder="Escreve a tua mensagem"></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Enviar mensagem
            </button>

        </form>
</body>
